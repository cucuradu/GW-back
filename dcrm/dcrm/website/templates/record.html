{% extends 'base.html' %}
{% block content %}

<div class="card">
    <div class="card-header">
      {{ customer_record.first_name }} {{ customer_record.last_name}}
    </div>
    <div class="card-body">
        <p class="card-text">
            {{ customer_record.email }}
            {{ customer_record.phone }}
            {{ customer_record.created_at }}
        </p>
    </div>
</div>

<br/><br/>
<a href="{% url 'home' %} " class="btn btn-secondary">Back
</a>

<a href="{% url 'delete_record' customer_record.id %}" class="btn btn-danger">Delete
</a>


{% endblock %}
